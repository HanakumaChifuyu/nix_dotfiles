[main]
include=~/.cache/matugen/foot-colors.ini
font=JetBrainsMono Nerd Font:size=14
font-bold=JetBrainsMono Nerd Font:size=14
font-italic=JetBrainsMono Nerd Font:size=14
font-bold-italic=JetBrainsMono Nerd Font:size=14
pad=10x10 center
dpi-aware=yes
selection-target=both

gamma-correct-blending=yes

[url]
osc8-underline=always

[colors-dark]
urls=f0dfaf

[bell]
notify=yes
urgent=yes

[scrollback]
lines=50000

[mouse]
hide-when-typing=true

[csd]
preferred=none
size=0
border-width=1
border-color=ff444444

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+v

scrollback-up-page=none
scrollback-up-half-page=none
scrollback-up-line=none
scrollback-down-page=none
scrollback-down-half-page=none
scrollback-down-line=none
scrollback-home=none
scrollback-end=none

search-start=none
show-urls-launch=none
show-urls-copy=none
unicode-input=none

spawn-terminal=none
minimize=none
maximize=none
fullscreen=none
