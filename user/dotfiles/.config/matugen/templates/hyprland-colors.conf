# Hyprland 视觉元素绑定（borders / shadow / group）— generated by matugen
# 配色变量在 hypr-vars.conf 中定义，本文件假定已被 source

# ---- 把语义色绑到 Hyprland 视觉元素 ----
general {
    col.active_border   = $primary $tertiary 45deg
    col.inactive_border = $surface_container_high
}

decoration {
    shadow {
        color = $shadow
    }
}

group {
    col.border_active   = $primary
    col.border_inactive = $surface_container_high
    col.border_locked_active   = $tertiary
    col.border_locked_inactive = $surface_container
}
