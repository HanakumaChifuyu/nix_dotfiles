# Material 3 颜色变量 + pywal 兼容别名
# 同时供 hyprland & hyprlock source

$image = {{image}}
<* for name, value in colors *>
${{name}} = rgba({{value.default.hex_stripped}}ff)
<* endfor *>

# ---- pywal 兼容别名 ----
