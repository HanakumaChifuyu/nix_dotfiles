$color4  = $primary
$color5  = $tertiary
$color6  = $secondary
$color7  = $on_surface_variant
$color8  = $outline
$color9  = $primary
$color10 = $tertiary
$color11 = $secondary_container
$color12 = $primary_container
$color13 = $tertiary_container
$color14 = $secondary
$color15 = $on_surface
