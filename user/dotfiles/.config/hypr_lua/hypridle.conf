
general {
    lock_cmd = hyprlock # runs hyprlock if it is not already running (this is always run when "loginctl lock-session" is called)
    unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = 'hl.dsp.dpms({action="on"})' # turn of screen after sleep (not strictly necessary, but just in case)
    ignore_dbus_inhibit = false            # respect dbus idle-inhibit requests from firefox/mpv/steam etc.
}

listener {
    timeout = 600                     # 10 min
    on-timeout = loginctl lock-session # command to run when timeout has passed
    #on-resume = notify-send -i $iDIR " System Unlocked!"  # command to run when activity is detected after timeout has fired.
}

listener {
     timeout = 630                            # 10.5 min
     on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'  # command to run when timeout has passed
     on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'    # command to run when activity is detected after timeout has fired.
}
