# =============================================================================
# Shortcuts - custom command shortcuts
# =============================================================================

# Set prefix to Ctrl+a (like screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane management (keep current working directory)
# Alt-h/j/k/l is reserved for moving between panes; see navigation.conf.
# -v creates an above/below split, while -h creates a left/right split.
bind -n "M--" split-window -v -c "#{pane_current_path}"
bind -n "M-\" split-window -h -c "#{pane_current_path}"
bind -n M-q confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Window management
bind -n M-i new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-w choose-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-, command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-x confirm-before -p "Kill window #W? (y/n)" kill-window

# Copy mode (vim-style)
set -g mode-keys vi
bind -n M-/ copy-mode
# Press v once to begin selecting, and again to clear the selection.
bind -T copy-mode-vi v if-shell -F "#{selection_active}" "send -X clear-selection" "send -X begin-selection"
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi q
bind -T copy-mode-vi Escape send -X cancel
