# =============================================================================
# tmux.conf - tmux main configuration file
# =============================================================================

# =============================================
# 1. General Settings
# =============================================
set -g base-index 1              # Start window numbering at 1
set -g pane-base-index 1         # Start pane numbering at 1
set -g mouse on
set -g history-limit 50000        # Command history limit
set -g escape-time 0             # Fast escape (recommended for vim users)
set -g focus-events on           # Enable focus events
set -g aggressive-resize on      # Resize only current pane

set -g @yank_action 'copy-pipe'
# =============================================
# 2. Module Imports
# =============================================
source-file ~/.config/tmux/shortcuts.conf
source-file ~/.config/tmux/navigation.conf
source-file ~/.config/tmux/plugins.conf
