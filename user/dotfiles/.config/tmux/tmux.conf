# =============================================================================
# tmux.conf - tmux main configuration file
# =============================================================================

# =============================================
# 1. General Settings
# =============================================
set -g base-index 1              # Start window numbering at 1
set -g pane-base-index 1         # Start pane numbering at 1
set -g mouse on
set -g history-limit 50000        # Command history limit
set -g escape-time 0             # Fast escape (recommended for vim users)
set -g focus-events on           # Enable focus events
set -g aggressive-resize on      # Resize only current pane
# Let applications opt in to unambiguous modified-key sequences (for example,
# Shift+Enter). Keeping this on-demand avoids breaking older terminal TUIs.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',kitty:extkeys'

set -g @yank_action 'copy-pipe'

# Theme: use the terminal's wallpaper-generated ANSI 16-color palette.
set -g status on
set -g status-position bottom
set -g status-style "bg=colour0,fg=colour7"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=colour4,fg=colour0,bold] #S #[bg=colour0,fg=colour4] "
set -g window-status-separator ""
set -g window-status-format "#[fg=colour8] #I:#W "
set -g window-status-current-format "#[bg=colour8,fg=colour15,bold] #I:#W "
set -g window-status-activity-style "fg=colour3,bold"
set -g window-status-bell-style "bg=colour1,fg=colour15,bold"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=colour4,fg=colour0,bold"
set -g message-command-style "bg=colour4,fg=colour0,bold"
set -g mode-style "bg=colour3,fg=colour0,bold"
set -g clock-mode-colour colour4
set -g status-right "#{prefix_highlight} #[fg=colour8]CPU #[fg=colour6]#{cpu_percentage} #[fg=colour8]· MEM #[fg=colour2]#{ram_percentage} #[fg=colour8]| %Y-%m-%d %H:%M "
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_prefix_prompt ' PREFIX'
set -g @prefix_highlight_fg 'colour0'
set -g @prefix_highlight_bg 'colour4'
set -g @prefix_highlight_copy_mode_attr 'fg=colour0,bg=colour1,bold'

# =============================================
# 2. Module Imports
# =============================================
source-file ~/.config/tmux/shortcuts.conf
source-file ~/.config/tmux/navigation.conf
source-file ~/.config/tmux/plugins.conf
