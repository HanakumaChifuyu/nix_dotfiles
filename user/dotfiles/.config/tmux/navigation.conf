# =============================================================================
# Navigation - pane/window/session navigation shortcuts
# =============================================================================


# Move between panes with Alt + vim directions.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes with Alt + arrow keys. Avoids the Alt+Shift+vim bindings used by
# Hyprland for window management.
unbind -n M-H
unbind -n M-J
unbind -n M-K
unbind -n M-L
bind -n M-Left resize-pane -L 1
bind -n M-Down resize-pane -D 1
bind -n M-Up resize-pane -U 1
bind -n M-Right resize-pane -R 1

# Reload configuration
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
